specVersion: "3.1"
metadata:
  name: hr360.datahealth
type: application
framework:
  name: SAPUI5
  version: "1.120.0"
  libraries:
    - name: sap.m
    - name: sap.f
    - name: sap.ui.core
    - name: sap.ui.layout
    - name: sap.suite.ui.microchart
    - name: sap.viz
    - name: themelib_sap_horizon
server:
  customMiddleware:
    - name: fiori-tools-proxy
      afterMiddleware: compression
      configuration:
        backend:
          - path: /sap
            url: http://YOUR-S4-HOST:PORT
            client: "100"
    - name: fiori-tools-appreload
      afterMiddleware: compression
