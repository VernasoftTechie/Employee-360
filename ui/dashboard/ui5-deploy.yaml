specVersion: "3.1"
metadata:
  name: hr360.datahealth
type: application
builder:
  resources:
    excludes:
      - "/test/**"
      - "/localService/**"
  customTasks:
    - name: deploy-to-abap
      afterTask: generateCachebusterInfo
      configuration:
        target:
          url: http://REPLACE-WITH-YOUR-S4-HOST:PORT
          client: "REPLACE-CLIENT"
        credentials:
          username: env:ABAP_USER
          password: env:ABAP_PASSWORD
        app:
          name: ZHR360_DATAHEALTH
          package: ZHR_UTIL
          transport: REPLACE-WITH-TRANSPORT
          description: "Employee Data Health dashboard"
        exclude:
          - /test/
