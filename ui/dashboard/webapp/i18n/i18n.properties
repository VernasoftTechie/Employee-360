# --- help ---
helpTitle=About this dashboard
helpWhat=What this dashboard shows
helpWhatText=Every employee's HR master data is checked, as of the last time the data was loaded, against the catalogue of checks listed below. You decide which checks are Critical and which are Warning using the Severity settings panel. The whole page can be drilled down by organisation. Only employees you are authorised to see are included.
helpClassify=How an employee is classified
helpClassifyText=CRITICAL - fails at least one check you marked Critical.\nWARNING - fails at least one Warning check but no Critical check.\nFully clean / OK - passes every check in the catalogue.\n\nCompleteness % for an employee = (checks passed / total checks) x 100. An org unit's completeness is the average of its members'.
helpChecklist=Using the Severity settings
helpChecklistText=Open the Severity settings panel, set each check to Critical or Warning, then press Apply. Your choices are remembered in this browser only (not shared with other users or devices). Reset restores the defaults shipped with the app.
helpDrill=Drilling by organisation
helpDrillText=In the "By organization" section, click a bar to go Company code -> Personnel area -> Org unit. The breadcrumb and every card above follow the current scope; "Up" widens it again. "Open in Employee 360" is always available - it opens the Employee 360 list filtered to whatever scope is currently shown. At org-unit level, clicking a bar opens that unit's filtered list directly.
helpCards=Reading each card
helpCardsText=Overview - counts and percentages for the whole workforce in scope; "Data score" is the average completeness %.\nWorkforce by status - the CRITICAL / WARNING / OK split as a donut.\nWhere the data breaks - how many employees each check (or category) affects; use the "Show" selector to switch. Bar colour = the check's current severity.\nBy organization - one bar per org node, split into critical / warning / ok; sort by highest critical rate or largest headcount.\nDetail - one row per company / personnel area / org unit; click a row to open its filtered Employee 360 list.
helpMath=How the numbers are calculated
helpMathText=Two different things are counted on the Overview, and they will not always agree.\n\nDATA SCORE - the average completeness of the whole checklist, severity ignored. For one employee, completeness = (checks passed / total checks) x 100; the Data score is the mean of that across every employee in scope. A missing bank account and a missing mobile number each cost the same. The score can therefore stay high even when every employee is Critical - it only means each record is missing a few fields out of many.\n\nCRITICAL / WARNING / FULLY CLEAN cards and the status donut - a count of employees, where each employee is put in ONE bucket by their most severe failed check:\n  - fails any check you marked Critical  ->  CRITICAL (any Warning-level gaps that employee also has are not reflected here)\n  - otherwise fails any Warning check    ->  WARNING\n  - otherwise                            ->  FULLY CLEAN\n\nWHERE THE DATA BREAKS - a count per check: how many employees fail that specific check. The bar colour is the check's current severity.\n\nWorked example - a plant with 5 employees (catalogue = 31 checks):\n  All 5 miss Organisational unit (Critical), Job (Critical) and HR administrator (Warning). 2 of them also miss Cost centre, Bank details and Payment method (Critical).\n  - Check failures  = 5 + 5 + 5 + 2 + 2 + 2 = 21\n  - Checks passed   = 5 x 31 - 21 = 134\n  - Data score      = 134 / 155 = 86.5%\n  - Every employee fails at least one Critical check, so CRITICAL = 5, WARNING = 0, FULLY CLEAN = 0.\nThe Warning check (HR administrator) still shows in "Where the data breaks" with an orange bar even though the Warning card reads 0 - those warnings are real, but they are outranked by a Critical gap on the same person. Clear the Critical checks for those employees and the same people move into the WARNING bucket.
helpChecks=The checks
helpScope=Data currency & scope
helpScopeText=The figures are as of the last data load - press the reload button in the header to refresh. Scope is employees with a current organisational assignment. Row-level authorisation applies: you only see organisations you are entitled to.
helpNotCovered=What is not covered yet
helpNotCoveredText=Payroll-specific checks (wage types, pay-scale reclassification, tax and social-insurance infotypes) are a separate scope, pending customer discussion. Some cross-system consistency checks (cost centre valid in Controlling, position exists in Organizational Management, org-assignment gaps) are also planned but not yet active. Do not read a clean result as proof that payroll data is correct.
helpNext=Where you could take this next
helpNext1=Turn on the parked Payroll checks once the payroll configuration is confirmed.
helpNext2=Add the cross-system consistency checks (Controlling / Organizational Management / time-slice gaps).
helpNext3=Schedule a periodic snapshot so the dashboard can show a trend, not just today's picture.
helpNext4=Email each HR administrator the list of their employees failing Critical checks.
helpNext5=Let an HR admin publish one approved Critical / Warning mapping as the org-wide default.
helpNext6=Add a "fix-by" target per check and report on breaches, not just presence.
